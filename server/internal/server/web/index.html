<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>DevvioRD · Remote Desktop</title>
<style>
  :root {
    --bg: #0b0f14;
    --surface: #141a21;
    --surface2: #1d252f;
    --accent: #35d07f;
    --blue: #5b9df5;
    --text: #e9eff6;
    --dim: #93a4b8;
    --danger: #ff6b5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- login ---------- */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #12283a 0%, var(--bg) 60%);
    padding: 20px; z-index: 50;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--surface); border-radius: 18px;
    padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .brand h1 { font-size: 22px; margin: 0; letter-spacing: .06em; }
  .sub { color: var(--dim); font-size: 13px; margin: 0 0 18px 20px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 6px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--surface2);
    background: var(--surface2); color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 14px; border-radius: 12px; border: 0; background: var(--accent);
    color: #04140c; font-weight: 700; font-size: 15px; margin-top: 18px; cursor: pointer;
  }
  button:active { transform: scale(.99); }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ---------- toolbar ---------- */
  header {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #0d1219;
    border-bottom: 1px solid #1a222c; flex: 0 0 auto;
  }
  .pill {
    font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 20px;
    background: var(--surface2); color: var(--dim); white-space: nowrap;
  }
  .pill.on { color: var(--accent); }
  .pill.warn { color: #f5c451; }
  .pill.err { color: var(--danger); }
  .spacer { flex: 1; }
  .btn {
    padding: 8px 11px; border-radius: 10px; background: var(--surface2); color: var(--text);
    font-size: 13px; border: 0; cursor: pointer; white-space: nowrap; width: auto; margin: 0;
  }
  .btn:hover { background: #26313d; }
  .btn.active { background: var(--accent); color: #04140c; font-weight: 700; }

  /* ---------- stage ---------- */
  #stage {
    position: relative; flex: 1 1 auto; overflow: hidden; background: #000;
    touch-action: none; cursor: crosshair;
  }
  #stage.mouse-mode { cursor: none; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #cursor {
    position: absolute; width: 0; height: 0; pointer-events: none; display: none;
    border-left: 9px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent;
    filter: drop-shadow(0 0 1px #000) drop-shadow(0 1px 2px rgba(0,0,0,.8));
    transform-origin: 0 0; z-index: 3;
  }
  #overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5,8,12,.85); z-index: 10; color: var(--dim); font-size: 14px; text-align: center;
  }

  /* ---------- files drawer ---------- */
  #drawer {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92vw);
    background: var(--surface); border-left: 1px solid #1a222c; z-index: 20;
    display: none; flex-direction: column;
  }
  #drawer.open { display: flex; }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid #1a222c; }
  .drawer-title { font-weight: 700; font-size: 14px; flex: 1; }
  #filelist { flex: 1; overflow-y: auto; padding: 6px; }
  .file {
    display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer;
    font-size: 13px;
  }
  .file:hover { background: var(--surface2); }
  .file .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .size { color: var(--dim); font-size: 11px; }
  .drawer-foot { padding: 10px; border-top: 1px solid #1a222c; display: flex; gap: 8px; }
  .drawer-foot .btn { flex: 1; text-align: center; padding: 11px; }
  #uploadInput { display: none; }
  .path { font-size: 11px; color: var(--dim); padding: 0 12px 8px; word-break: break-all; }

  /* ---------- hidden ime field ---------- */
  #ime {
    position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0;
    border: 0; background: transparent; color: transparent;
  }
  #pairPanel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--surface); border: 1px solid #1a222c; border-radius: 18px;
    padding: 20px; z-index: 25; display: none; width: min(360px, 92vw); text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  #pairPanel.open { display: block; }
  .pair-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .pair-sub { font-size: 12px; color: var(--dim); margin-bottom: 12px; line-height: 1.5; }
  .pair-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    color: var(--accent); word-break: break-all; margin-top: 10px;
    background: var(--surface2); border-radius: 8px; padding: 8px;
  }
  #qrBox svg { width: 100%; max-width: 240px; height: auto; display: block; margin: 0 auto; background: #fff; padding: 8px; border-radius: 10px; }
  #toast {
    position: absolute; left: 50%; top: 18px; transform: translate(-50%, 0);
    background: rgba(0,0,0,.85); color: var(--text); font-size: 13px; padding: 10px 14px;
    border-radius: 10px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30;
    max-width: 80%; text-align: center;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="bar" style="display:none">
    <span class="pill" id="status">connecting…</span>
    <span class="spacer"></span>
    <button class="btn" id="modeBtn" title="Toggle touch / mouse mode">TOUCH</button>
    <button class="btn hide-sm" id="kbBtn" title="Keyboard">⌨</button>
    <button class="btn hide-sm" id="pasteBtn" title="Paste phone clipboard to host">⬆ clip</button>
    <button class="btn hide-sm" id="copyBtn" title="Copy host clipboard to phone">⬇ clip</button>
    <button class="btn hide-sm" id="pairBtn" title="Connect a phone">Pair</button>
    <button class="btn" id="filesBtn" title="Files">Files</button>
    <button class="btn hide-sm" id="statsBtn" title="Statistics">Stats</button>
    <button class="btn hide-sm" id="fsBtn" title="Fullscreen">⛶</button>
  </header>

  <div id="stage">
    <img id="screen" alt="remote desktop">
    <div id="cursor"></div>
    <div id="overlay"><div>
      <div style="font-size:15px;color:#e9eff6;margin-bottom:6px">Disconnected</div>
      <div id="overlayMsg"></div>
    </div></div>
    <div id="drawer">
      <div class="drawer-head">
        <span class="drawer-title">File transfer</span>
        <button class="btn" id="drawerClose">✕</button>
      </div>
      <div class="path" id="drawerPath">/</div>
      <div id="filelist"></div>
      <div class="drawer-foot">
        <button class="btn" id="uploadBtn">⬆ Upload</button>
        <button class="btn" id="refreshBtn">↻</button>
      </div>
      <input type="file" id="uploadInput" multiple>
    </div>
    <div id="pairPanel">
      <div class="pair-title">Connect the Android app</div>
      <div class="pair-sub">Scan this code with the DevvioRD app, or type the address manually.</div>
      <div id="qrBox"></div>
      <div class="pair-url" id="pairUrl">…</div>
      <div class="pair-sub" id="pairHint"></div>
      <button class="btn" id="pairClose" style="margin-top:12px">Close</button>
    </div>
    <div id="toast"></div>
  </div>
  <input id="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</div>

<div id="login">
  <div class="card">
    <div class="brand"><span class="dot"></span><h1>DevvioRD</h1></div>
    <p class="sub">Remote Desktop · Web Client</p>
    <label for="token">Access token (leave empty if the server has none)</label>
    <input id="token" type="password" placeholder="optional token">
    <label for="quality">Stream quality</label>
    <input id="quality" type="range" min="20" max="90" value="70" style="padding:0">
    <button id="connectBtn">Connect</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<script src="client.js"></script>
</body>
</html>
